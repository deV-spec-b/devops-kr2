services:
  app:
    build: .
    image: kr2-app:1.0
    env_file: .env
    environment:
      REDIS_HOST: redis
      STUDENT: Skorobagatko
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", ""]
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"devops:~/kr2/REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis_data:

networks:
  backend:
